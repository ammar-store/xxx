<html manifest="Cache.manifest"><head>
<title>PS4 Host the Ammar-Store offline</title>
<style>
html, body {
background-image: url('../../img.jpg');
background-size: 100%;
background-repeat: no-repeat;
background-color: #24272b;
color: white;
text-align: center;
margin: 0px;
overflow: hidden;
}
h1 {
text-shadow: 0.1em 0.1em 0.2em black;
font-size: 25px;
text-align: center;
color: white;
}
a {
text-decoration: none;
}
</style>

<style id="ammar-store-theme">
html, body {
  background-image: url('../ammar-store-background.png') !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  background-color: #030b18 !important;
}
button, input[type="button"], input[type="submit"], input[type="reset"], .btn, .button, .scorp-btn, a[class*="btn"], a.button, a.btn {
  color: #f5faff !important;
  background: linear-gradient(125deg, rgba(3, 24, 58, .96), rgba(0, 91, 190, .88)) !important;
  border: 2px solid #159dff !important;
  border-radius: 8px !important;
  box-shadow: 0 0 10px rgba(0, 132, 255, .36), inset 0 0 8px rgba(20, 146, 255, .16) !important;
  transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease !important;
}
button:hover, input[type="button"]:hover, input[type="submit"]:hover, input[type="reset"]:hover, .btn:hover, .button:hover, .scorp-btn:hover, a[class*="btn"]:hover, a.button:hover, a.btn:hover {
  color: #ffffff !important;
  background: linear-gradient(125deg, #087cff, #f57924) !important;
  border-color: #ff9a37 !important;
  box-shadow: 0 0 16px rgba(0, 132, 255, .55), 0 0 18px rgba(255, 122, 35, .28) !important;
  transform: translateY(-1px);
}
</style>
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));setTimeout(function(){window.progress.innerHTML="Installing Offline Cache: " + Percent + "%";},500)}
function DisplayCacheProgress(){setTimeout(function(){window.progress.innerHTML="Cache Installed Successfully ✔";},1500);setTimeout(function(){window.progress.innerHTML="Now Close And Re-Open Your Browser ..";},3500);}window.applicationCache.addEventListener("progress",DLProgress,false);window.applicationCache.oncached=function(e){DisplayCacheProgress();};window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
<br><br><br><br><br><br>
<h1 id=progress style="font-size: 30px;margin-top: 77px;margin-bottom: 250px;">There is a problem clear the cache and try again</h1>

</html>
