<html manifest="Cache.manifest">
<head>
<title>THE Ammar-Store HOST 6.72</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-image: url('../../img.jpg'); 
  background-size: 100% 100%; 
  background-position: center center;
  background-repeat: no-repeat;
}
</style>

<style id="ammar-store-theme">
html, body {
  background-image: url('../../ammar-store-background.png') !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
  background-color: #030b18 !important;
}
button, input[type="button"], input[type="submit"], input[type="reset"], .btn, .button, .scorp-btn, a[class*="btn"], a.button, a.btn {
  color: #f5faff !important;
  background: linear-gradient(125deg, rgba(3, 24, 58, .96), rgba(0, 91, 190, .88)) !important;
  border: 2px solid #159dff !important;
  border-radius: 8px !important;
  box-shadow: 0 0 10px rgba(0, 132, 255, .36), inset 0 0 8px rgba(20, 146, 255, .16) !important;
  transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease !important;
}
button:hover, input[type="button"]:hover, input[type="submit"]:hover, input[type="reset"]:hover, .btn:hover, .button:hover, .scorp-btn:hover, a[class*="btn"]:hover, a.button:hover, a.btn:hover {
  color: #ffffff !important;
  background: linear-gradient(125deg, #087cff, #f57924) !important;
  border-color: #ff9a37 !important;
  box-shadow: 0 0 16px rgba(0, 132, 255, .55), 0 0 18px rgba(255, 122, 35, .28) !important;
  transform: translateY(-1px);
}
</style>
</head>
<body>

<!-- The HTML elements must be placed ABOVE the script so the script can find them -->
<br>
<h1 id="msgs" style="font-size: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; text-align: center; margin: 0; width: 100%;">
  Compiled and Hacked By Ahmed Essam
</h1>
<script>
// Safely clear the URL tracking state without crashing the page history
if(window.history.replaceState) {
  window.history.replaceState(null, null, 'index.html');
}

function DLProgress(e){
  if (e.total) {
    var Percent = Math.round(e.loaded / e.total * 100);
    document.getElementById("msgs").innerHTML = "Installing Offline Cache: " + Percent + "%";
  }
}

function DisplayCacheProgress(){
  setTimeout(function(){
    document.getElementById("msgs").innerHTML = "Cache Installed Successfully ✔";
  }, 1000);
  
  setTimeout(function(){
    document.getElementById("msgs").innerHTML = "Now close.......disconnect the Internet from the device and reopen your browser...";
  }, 3000);
}

// Attach the caching events properly to the applicationCache system
if (window.applicationCache) {
  window.applicationCache.addEventListener("progress", DLProgress, false);
  window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
  window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
}
</script>

</body>
</html>
